[package]
name = "anicap"
version = "0.1.0"
authors = ["Daniel Cordova <danesc87@gmail.com>"]
edition = "2021"
license = "GPLv3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Temp dep becuase actix web is complaining about h1_allow_half_closed
actix-http = "3.12.1"
actix-web = "4.13.0"
actix-cors = "0.7.1"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
futures = "0.3.32"
config = "0.15.2"
env_logger = "0.11.10"
lazy_static = "1.5.0"
serde = "1.0.228"
serde_json = "1.0.149"
detrim = "0.1.6"
data-encoding = "2.11.0"
thiserror = "2.0.18"
validator = { version = "0.20.0", features = ["derive"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
chrono = { version = "0.4.44", features = ["serde"] }
diesel = { version = "2.3.9", features = ["mysql", "r2d2", "chrono"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true
