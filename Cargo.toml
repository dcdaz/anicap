[package]
name = "anicap"
version = "0.1.0"
authors = ["Daniel Cordova <danesc87@gmail.com>"]
edition = "2021"
license = "GPLv3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7.1"
jsonwebtoken = "9.3.1"
futures = "0.3.31"
config = "0.15.13"
env_logger = "0.11.8"
lazy_static = "1.5.0"
serde = "1.0.219"
serde_json = "1.0.142"
detrim = "0.1.5"
data-encoding = "2.9.0"
thiserror = "2.0.12"
validator = { version = "0.20.0", features = ["derive"] }
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.12", features = ["sqlite", "r2d2", "chrono"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
