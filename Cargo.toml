[package]
name = "anicap"
version = "0.1.0"
authors = ["Daniel Cordova <danesc87@gmail.com>"]
edition = "2021"
license = "GPLv3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.9.0"
actix-cors = "0.7.0"
jsonwebtoken = "9.3.0"
futures = "0.3.31"
config = "0.14.0"
env_logger = "0.11.5"
lazy_static = "1.5.0"
serde = "1.0.213"
serde_json = "1.0.132"
data-encoding = "2.6.0"
thiserror = "2.0.3"
chrono = { version = "0.4.38", features = ["serde"] }
diesel = { version = "2.2.4", features = ["sqlite", "r2d2", "chrono"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
